<div class="dashboard">

  <hr>

  <!-- State debug info (development)
  <pre>
    loading: {{ loading }}
    animals: {{ animals.length }}
    total: {{ total }}
    error: {{ error }}
  </pre>
  -->
  <!-- Filter buttons - mirrors btn1/btn2/btn3/btn4 from python script -->
  <div class="filter-bar">
    <span class="filter-label">Rescue type:</span>
    <button *ngFor="let r of rescueTypes"
            (click)="selectRescueType(r.id)"
            [class]="'btn btn-' + r.id"
            [class.active]="rescueType === r.id">
      {{ r.label }}
    </button>
  </div>

  <hr>

  <!-- Loading state - displayed when data is being fetched -->
  <div *ngIf="loading" class="status-message">
    Loading...
  </div>

  <!-- Error state -->
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <!-- Results summary - shows count of displayed vs total animals -->
  <div *ngIf="!loading && !error" class="results-summary">
    Showing {{ animals.length }} of {{ total }} animals
  </div>

  <!--
    Data table - displays animal records in a scrollable wrapper
    Only shown when data is loaded and there are animals to display
    Rows are clickable to select an animal for map/chart updates
  -->
  <div *ngIf="!loading && (animals.length || 0) > 0" class="table-wrapper">
    <table aria-label="Animal records table">
      <thead>
        <tr>
          <th *ngFor="let col of visibleColumns">{{ col.label }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of animals"
            (click)="selectAnimal(a)"
            [class.selected]="selectedAnimal?._id === a._id"
            style="cursor: pointer;">
          <td *ngFor="let col of visibleColumns">
            {{ a[col.key] || '-' }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- No results -->
  <div *ngIf="!loading && !error && (animals.length || 0) === 0" class="status-message">
    No animals match this filter.
  </div>

  <!--
    Pagination controls - only shown when there are more records than pageSize
    Previous button disabled on first page
    Next button disabled on last page
    Shows current page and total pages
  -->
  <div *ngIf="!loading && (total || 0) > pageSize"
       class="pagination"
       aria-label="Pagination controls">
    <button (click)="changePage(currentPage - 1)"
            [disabled]="currentPage === 0">
      Previous
    </button>

    <span>Page {{ currentPage + 1 }} of {{ totalPages }}</span>

    <button (click)="changePage(currentPage + 1)"
            [disabled]="currentPage + 1 >= totalPages">
      Next
    </button>
  </div>

  <hr>

  <!--
    Map & Chart section - collapsed by default
    Uses HTML5 details/summary for expandable content
    Shows map and chart side by side when expanded
  -->
  <details class="map-chart-details">
    <summary aria-label="Map and Chart section">
    🗺️ Map & Chart
    </summary>
    <div class="map-chart-row">
      <div class="map-col">
        <app-map [animals]="animals"
                 [selectedAnimal]="selectedAnimal">
        </app-map>
      </div>
      <div class="chart-col">
        <app-chart [breedData]="breedData"
                   [rescueType]="rescueType">
        </app-chart>
      </div>
    </div>
  </details>

  <hr>

  <!--
    Column Visibility - collapsed by default
    Allows users to toggle which columns appear in the table
    Changes persist via component state
  -->
  <details class="col-visibility">
    <summary aria-label="Column Visibility section">
    📦 Column Visibility
    </summary>
    <div class="col-checklist">
      <label *ngFor="let col of allColumns">
        <input type="checkbox"
               [checked]="isVisible(col.key)"
               (change)="toggleColumn(col.key)">
        {{ col.label }}
      </label>
      <p class="col-hint">Check to show, uncheck to hide.</p>
    </div>
  </details>

</div>
