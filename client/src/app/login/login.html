<!--
  login.html - Template for LoginComponent
  Provides a simple login form for user authentication
  Includes username and password fields with submit button
  Displays error message on failed authentication attempts
-->

<div class="login-box">

  <h1>
    Login
  </h1>

  <label>
    Username
  </label>

  <input [(ngModel)]="username">

  <label>
    Password
  </label>

  <input type="password"
         [(ngModel)]="password">

  <button (click)="login()">
    Login
  </button>

  <p *ngIf="error">
    {{error}}
  </p>
</div>
